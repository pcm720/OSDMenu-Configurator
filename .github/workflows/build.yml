name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
    - name: Install cmake
      run: |
        apk add cmake

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fetch full clone
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Resolve build version
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="$(git describe --always --dirty --tags --exclude nightly)"
          VERSION="${VERSION#v}"
        fi
        echo "CI_VERSION=${VERSION}" >> $GITHUB_ENV

    # - name: Compile non-VFS version
    #   id: make
    #   run: |
    #     cmake -B build -DAPP_VERSION_OVERRIDE=${{ env.CI_VERSION }} -DSAS_TITLE_VERSION=${{ env.CI_VERSION }}
    #     cmake --build build

    - name: Compile VFS version
      id: make-vfs
      run: |
        cmake -B build -DEMBED_VFS=ON -DOUTDIR=release_vfs -DAPP_VERSION_OVERRIDE=${{ env.CI_VERSION }} -DSAS_TITLE_VERSION=${{ env.CI_VERSION }}
        cmake --build build
        rm -rf build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: steps.make.outcome == 'success'
      with:
        name: artifacts
        path: |
          release/**
          release_vfs/**

    - name: Build release archive
      run: |
        rm -rf package
        mkdir -p package
        cp release_vfs/README.md package/README.MD
        cp release_vfs/r3configurator.elf package/r3configurator.elf
        cp release_vfs/title.cfg package/title.cfg
        cp release_vfs/icon.sys package/icon.sys
        cp release_vfs/copy.icn package/copy.icn
        cp release_vfs/del.icn package/del.icn
        cp release_vfs/list.icn package/list.icn
        cd package
        zip -r ../SYS_R3CONFIGURATOR.zip README.MD r3configurator.elf title.cfg icon.sys copy.icn del.icn list.icn

    - name: Create nightly release
      uses: "marvinpinto/action-automatic-releases@latest"
      if: github.ref == 'refs/heads/main'
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "nightly"
        prerelease: true
        title: "Nightly build"
        files: |
          SYS_R3CONFIGURATOR.zip

    - name: Create stable release
      uses: "marvinpinto/action-automatic-releases@latest"
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        draft: true
        files: |
          SYS_R3CONFIGURATOR.zip

